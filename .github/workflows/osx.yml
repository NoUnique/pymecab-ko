name: Build OSX wheels

permissions:
  contents: read
  id-token: write

on:
  workflow_dispatch:
    inputs:
      publish_target:
        description: "Select repository when manually triggered (default: PyPI)"
        type: choice
        required: false
        options: [pypi, testpypi]
        default: pypi

jobs:
  build_osx:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up python
      uses: actions/setup-python@v5
      with:
        python-version: |
          3.8
          3.9
          3.10
          3.11
          3.12
          3.13
    - name: Download and build MeCab
      shell: bash
      run: |
        .github/macos-build.sh
    - name: Upload Wheels
      uses: actions/upload-artifact@v4
      with: 
        name: osx-wheels
        path: dist
    - name: Resolve publish target
      id: publish-target
      run: |
        set -euo pipefail
        target="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish_target || 'pypi' }}"
        if [[ "$target" == 'testpypi' ]]; then
          echo 'url=https://test.pypi.org/legacy/' >> "$GITHUB_OUTPUT"
        else
          echo 'url=https://upload.pypi.org/legacy/' >> "$GITHUB_OUTPUT"
        fi
    - name: Publish wheels if tagged
      if: startsWith(github.ref, 'refs/tags') && github.repository_owner == 'NoUnique'
      uses: pypa/gh-action-pypi-publish@v1
      with:
        repository-url: ${{ steps.publish-target.outputs.url }}

