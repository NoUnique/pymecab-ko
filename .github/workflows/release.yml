name: Release

# Builds the sdist and wheels for every supported platform, then publishes
# them when run against a tag. Wheel building is handled by cibuildwheel
# (configured in pyproject.toml); the set of CPython versions is not spelled
# out anywhere in this repository, so new Python releases are picked up
# automatically once cibuildwheel supports them.
#
# The workflow can also be called by another workflow (see auto-release.yml)
# to rebuild an existing release tag and upload only the files that are not
# on PyPI yet, e.g. wheels for a CPython version released after the tag.

on:
  workflow_dispatch:
    inputs:
      publish_target:
        description: 'Select the repository for uploading (default: PyPI)'
        type: choice
        required: false
        options: [pypi, testpypi]
        default: testpypi
      create_github_release:
        description: 'Create GitHub Release with built artifacts'
        type: boolean
        default: false
  workflow_call:
    inputs:
      tag:
        description: 'Existing release tag to rebuild (e.g. v1.0.3)'
        type: string
        required: true
      publish:
        description: 'Upload to PyPI, skipping files that already exist there'
        type: boolean
        default: false
      update_github_release:
        description: 'Attach the built files to the GitHub Release of the tag'
        type: boolean
        default: false

jobs:
  build_sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: release-sdist
          path: dist/*.tar.gz

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest      # manylinux2014 x86_64
          - ubuntu-24.04-arm   # manylinux2014 aarch64 (native, no QEMU)
          - macos-latest       # x86_64 + arm64 + universal2
          - windows-latest     # win_amd64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Always the latest cibuildwheel from PyPI (there is no floating major
      # tag of the pypa/cibuildwheel action), so new CPython versions are
      # picked up without touching this file. auto-release/check.py installs
      # it the same way, so both sides agree on what can be built.
      - name: Install cibuildwheel
        run: python -m pip install --upgrade pip cibuildwheel
      - name: Build and test wheels
        run: python -m cibuildwheel --output-dir wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: release-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  publish_pypi:
    if: github.ref_type == 'tag' || inputs.publish
    needs: [build_sdist, build_wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Resolve publish target
        id: publish
        run: |
          target="${{ github.event.inputs.publish_target || 'pypi' }}"
          if [[ "$target" == 'testpypi' ]]; then
            echo 'url=https://test.pypi.org/legacy/' >> "$GITHUB_OUTPUT"
          else
            echo 'url=https://upload.pypi.org/legacy/' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ steps.publish.outputs.url }}
          packages-dir: dist
          # When rebuilding an existing release only the new files are
          # uploaded; files already on PyPI are skipped instead of failing.
          skip-existing: ${{ inputs.publish || false }}

  github_release:
    if: >-
      (github.ref_type == 'tag' && github.event.inputs.create_github_release == 'true')
      || (inputs.publish && inputs.update_github_release)
    needs: [build_sdist, build_wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*
