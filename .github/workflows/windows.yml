name: Build Python Windows wheels

permissions:
  contents: read
  id-token: write

on:
  workflow_dispatch:
    inputs:
      publish_target:
        description: "Select repository when manually triggered (default: PyPI)"
        type: choice
        required: false
        options: [pypi, testpypi]
        default: pypi

jobs:
  build:
    runs-on: windows-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.8, 3.9, "3.10", "3.11", "3.12", "3.13"]
        include:
          - python-version: 3.8
            py-short: 38
            py-short2: 38
          - python-version: 3.9
            py-short: 39
            py-short2: 39
          - python-version: "3.10"
            py-short: 310
            py-short2: 310
          - python-version: "3.11"
            py-short: 311
            py-short2: 311
          - python-version: "3.12"
            py-short: 312
            py-short2: 312
          - python-version: "3.13"
            py-short: 313
            py-short2: 313
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Cache mecab
      id: cache-mecab
      uses: actions/cache@v4
      with:
        path: C:/mecab
        key: mecab-win-build
    - name: Download MeCab Win and Unzip it
      if: steps.cache-mecab.outputs.cache-hit != 'true'
      shell: bash
      run: |
        curl -L "https://github.com/Pusnow/mecab-ko-msvc/releases/download/release-0.9.2-msvc-4/mecab-ko-msvc-x64.zip" -o mecab-msvc-x64.zip
        unzip -o "mecab-msvc-x64.zip" -d c:/mecab
    - name: Install dependencies
      run: |
        python -m pip install --upgrade setuptools wheel pip
    - name: Build wheel
      run: |
        python setup.py bdist_wheel
    - name: Upload Wheel
      uses: actions/upload-artifact@v4
      with:
        name: win-wheels-${{ matrix.python-version }}
        path: dist
    - name: Check wheels
      shell: bash
      run: |
        ls -la
        ls -la dist
        VERSION=$(python setup.py --version)
        pip install "dist/mecab_ko-${VERSION}-cp${{ matrix.py-short }}-cp${{ matrix.py-short2 }}-win_amd64.whl"
    - name: Resolve publish target
      id: publish-target
      run: |
        set -euo pipefail
        target="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish_target || 'pypi' }}"
        if [[ "$target" == 'testpypi' ]]; then
          echo 'url=https://test.pypi.org/legacy/' >> "$GITHUB_OUTPUT"
        else
          echo 'url=https://upload.pypi.org/legacy/' >> "$GITHUB_OUTPUT"
        fi
    - name: Publish wheels if tagged
      if: startsWith(github.ref, 'refs/tags') && github.repository_owner == 'NoUnique'
      uses: pypa/gh-action-pypi-publish@v1
      with:
        repository-url: ${{ steps.publish-target.outputs.url }}


